<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Questory • Reino do Conhecimento</title><style>
:root{font-family:system-ui,Segoe UI,sans-serif;background:#0b1020;color:#eef2ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#253362 0,#0b1020 40%);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:25px}header,.flex{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}header{border-bottom:1px solid #33415d;padding-bottom:22px;margin-bottom:25px}h1{margin:0;color:#c7b7ff}h2{margin:8px 0 15px;font-size:23px}h3{margin:10px 0}p{color:#bac6dc;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}.card{background:#18223a;border:1px solid #34415c;border-radius:18px;padding:23px;margin:14px 0;box-shadow:0 10px 30px #05081655}.muted,small{color:#a9b9d2}button,input,textarea{font:inherit}button{border:0;background:#8771ed;color:white;padding:12px 18px;border-radius:11px;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.12)}button:disabled{opacity:.5;cursor:wait}.secondary{background:#344463}.danger{background:#8a3655}input,textarea{width:100%;color:#fff;background:#101a2d;border:1px solid #4a5b7a;border-radius:12px;padding:13px;margin:6px 0 16px}textarea{min-height:135px;resize:vertical}label{display:block;font-weight:700}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}nav button{background:#283652}nav button.active{background:#8771ed}.tag{display:inline-block;border-radius:12px;background:#284e49;color:#a7ffe1;padding:5px 10px;font-size:12px}.bar{background:#37415a;height:12px;border-radius:9px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#3fc3a0,#a180ff)}.question{font-size:20px;font-weight:750}.answer{display:block;text-align:left;width:100%;margin:9px 0;background:#283653}.answer:disabled{opacity:.8}.lesson{border-left:3px solid #8b78eb;padding:10px 16px;margin:12px 0;background:#202c45}.hide{display:none!important}#notice{position:fixed;bottom:18px;right:18px;max-width:420px;background:#344463;border-radius:12px;padding:15px;box-shadow:0 10px 25px #0009}.gold{color:#ffc96f}.hp{color:#ff97a5}details{margin:14px 0}summary{cursor:pointer;font-weight:700}pre{white-space:pre-wrap;font:inherit}.center{text-align:center}.mini{font-size:12px}a{color:#bcaaff}@media(max-width:600px){.wrap{padding:15px}header{align-items:flex-start}}
</style></head><body><div class="wrap"><header><h1>⚔️ Questory</h1><div id="headstats" class="muted">Seu reino do conhecimento</div><button id="logout" class="secondary hide">Sair</button></header><div id="login" class="card" style="max-width:480px;margin:60px auto"><h2>🔐 Entrar no Reino</h2><p>Somente sua conta autorizada pode acessar as jornadas.</p><form id="loginform"><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button>Entrar</button></form></div><section id="app" class="hide"><nav><button data-view="home">🏰 Reino</button><button data-view="create">✨ Criar jornada</button><button data-view="shop">🛒 Loja</button><button data-view="review">🔁 Revisões</button></nav><div id="content"></div></section></div><div id="notice" class="hide"></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
let supabase,session=null,db={},view='home',chosenJourney=null,chosenLesson=null,questionList=[],qindex=0,battle=null,mode='practice',busy=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(msg){$('#notice').textContent=msg;$('#notice').classList.remove('hide');setTimeout(()=>$('#notice').classList.add('hide'),5500)}
async function request(route,method='GET',body){const token=(await supabase.auth.getSession()).data.session?.access_token;const opts={method,headers:{Authorization:`Bearer ${token}`}};if(body instanceof FormData)opts.body=body;else if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}const r=await fetch('/api'+route,opts),o=await r.json().catch(()=>({}));if(!r.ok)throw Error(o.error||'Falha na solicitação');return o}
async function action(fn){if(busy)return;busy=true;try{await fn()}catch(e){notify(e.message)}finally{busy=false}}
function showLogin(){session=null;$('#login').classList.remove('hide');$('#app').classList.add('hide');$('#logout').classList.add('hide');$('#headstats').textContent='Seu reino do conhecimento'}
async function refresh(){db=await request('/state');$('#headstats').innerHTML=`✨ ${db.player.xp} XP · <span class="gold">🪙 ${db.player.gold} ouro</span> · 🏰 Reino ${db.player.kingdom_level}`;render()}
function enter(v){view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
function render(){if(view==='home')home();if(view==='create')create();if(view==='shop')shop();if(view==='journey')journey();if(view==='lesson')lesson();if(view==='quiz')quiz();if(view==='review')review()}
function home(){const level=Math.floor(db.player.xp/250)+1;$('#content').innerHTML=`<h2>🏰 Seu Reino do Conhecimento</h2><div class="grid"><div class="card"><span class="tag">Herói nível ${level}</span><h2>⚡ ${db.player.xp} XP</h2><div class="bar"><div style="width:${db.player.xp%250/2.5}%"></div></div><p>${250-db.player.xp%250} XP para o próximo nível</p></div><div class="card"><h2 class="hp">❤️ ${db.player.hp}/${db.player.max_hp}</h2><p>Vida do herói (a vida da batalha é temporária).</p></div><div class="card"><h2>📚 ${db.journeys.length} jornadas</h2><p>Um reino construído com conhecimento.</p></div></div><div class="flex"><h2>Suas jornadas</h2><button id="new">+ Nova jornada</button></div><div class="grid">${db.journeys.map(j=>`<div class="card"><span class="tag">Rota do herói</span><h3>${esc(j.title)}</h3><p>${esc(j.plan?.description||'Comece sua jornada!').slice(0,180)}</p><button data-open="${j.id}">Explorar →</button></div>`).join('')||'<div class="card"><p>Você ainda não criou uma rota. Digite qualquer assunto para a IA organizar o aprendizado.</p></div>'}</div>`;$('#new').onclick=()=>enter('create');document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{chosenJourney=b.dataset.open;enter('journey')})}
function create(){$('#content').innerHTML=`<h2>✨ Arquiteto de Jornadas</h2><div class="card"><p>Escreva o assunto, do zero ao avançado, ou envie uma parte do conteúdo. A IA prepara módulos e lições automaticamente.</p><form id="newform"><label>O que deseja estudar?</label><input id="title" required minlength="3" placeholder="Ex.: Ciências Contábeis do básico ao avançado"><label>Material opcional</label><textarea id="source" placeholder="Cole texto de aulas, livros, ementas ou anotações..."></textarea><label>Ou carregue PDF, DOCX, TXT, MD ou CSV</label><input id="file" type="file" accept=".pdf,.docx,.txt,.md,.csv"><p class="mini">Sem material, a IA usa conhecimento próprio. Esta versão não faz pesquisa automática na web.</p><button id="make">⚔️ Gerar minha rota</button></form></div>`;$('#file').onchange=()=>action(async()=>{const f=$('#file').files[0];if(!f)return;let form=new FormData();form.append('file',f);const r=await request('/extract','POST',form);$('#source').value=r.text;notify(r.truncated?'Arquivo extraído (texto truncado).':'Material extraído!')});$('#newform').onsubmit=e=>{e.preventDefault();action(async()=>{const b=$('#make');b.disabled=true;b.textContent='IA construindo rota...';try{const r=await request('/journeys','POST',{title:$('#title').value,source:$('#source').value});chosenJourney=r.id;await refresh();enter('journey');notify(`${r.count} lições criadas`)}finally{b.disabled=false}})}}
function journey(){const j=db.journeys.find(x=>x.id===chosenJourney);if(!j)return enter('home');const lessons=db.lessons.filter(l=>l.journey_id===j.id).sort((a,b)=>a.module_index-b.module_index||a.lesson_index-b.lesson_index);$('#content').innerHTML=`<button class="secondary" id="back">← Reino</button><h2>📜 ${esc(j.title)}</h2><p>${esc(j.plan?.description)}</p><p class="tag">${lessons.length} lições · ${j.plan?.modules?.length||0} módulos</p>${lessons.map(l=>`<div class="lesson"><small>Capítulo ${l.module_index+1} · ${esc(l.body?.module||'')}</small><h3>${esc(l.topic)}</h3><p>${esc(l.body?.objective)}</p><button data-lesson="${l.id}">Abrir treinamento</button></div>`).join('')}<div class="card"><button id="delete" class="danger">🗑 Excluir esta jornada</button><p class="mini">Exclui também lições, questões e respostas. XP e ouro já ganhos permanecem.</p></div>`;$('#back').onclick=()=>enter('home');$('#delete').onclick=()=>{if(!confirm('Apagar definitivamente esta jornada e seus exercícios?'))return;action(async()=>{await request('/journeys/'+j.id,'DELETE');chosenJourney=null;await refresh();enter('home')})};document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{chosenLesson=b.dataset.lesson;enter('lesson')})}
function lesson(){const l=db.lessons.find(x=>x.id===chosenLesson);if(!l)return enter('home');$('#content').innerHTML=`<button class="secondary" id="back">← Jornada</button><div class="card"><span class="tag">📘 Treinamento sem dano</span><h2>${esc(l.topic)}</h2><h3>Objetivo</h3><p>${esc(l.body?.objective)}</p><h3>Explicação</h3><pre>${esc(l.body?.explanation)}</pre><h3>Exemplo resolvido</h3><pre>${esc(l.body?.example)}</pre></div><div class="card"><h2>Escolha seu desafio</h2><p>Na prática você recebe feedback sem dano. Na prova, acertar tira vida do monstro e errar tira sua vida.</p><button id="practice">🎯 Prática</button> <button id="exam">⚔️ Prova RPG</button> <button id="generate" class="secondary">✨ Gerar 5 questões com IA</button></div>`;$('#back').onclick=()=>enter('journey');$('#generate').onclick=()=>action(async()=>{notify('Gerando perguntas...');await request('/questions/generate','POST',{journeyId:l.journey_id,lessonId:l.id,difficulty:recommendedDifficulty(l)});notify('5 questões inéditas criadas!')});$('#practice').onclick=()=>start('practice');$('#exam').onclick=()=>start('exam')}
function recommendedDifficulty(l){const m=db.mastery.find(x=>x.journey_id===l.journey_id&&x.topic===l.topic);return Math.max(1,Math.min(10,Math.ceil((m?.score||0)*9)+1))}
async function start(type){await action(async()=>{const r=await request('/questions/'+chosenLesson);if(!r.items.length)throw Error('Primeiro clique em "Gerar 5 questões com IA".');questionList=r.items;mode=type;qindex=0;battle=null;if(type==='exam'){const l=db.lessons.find(x=>x.id===chosenLesson);battle=(await request('/battles','POST',{journeyId:l.journey_id,lessonId:l.id})).battle}enter('quiz')})}
function quiz(){if(qindex>=questionList.length||battle&&battle.status!=='active'){const won=battle?.status==='won';$('#content').innerHTML=`<div class="card center"><h2>${battle?(won?'🏆 Vitória!':'💀 Fim da batalha'):'🎯 Prática concluída!'}</h2><p>${won?'Você conquistou 75 XP e 40 de ouro!':'Revise seus erros e tente novamente.'}</p><button id="back">Voltar à lição</button></div>`;$('#back').onclick=async()=>{await refresh();enter('lesson')};return}const q=questionList[qindex];const hp=battle?.state?.hp??100,ehp=battle?.state?.enemy_hp??100,maxhp=battle?.enemy?.max_hp??100;$('#content').innerHTML=`<button id="leave" class="secondary">← Sair</button><div class="card"><span class="tag">${mode==='exam'?'⚔️ Prova RPG':'🎯 Prática guiada'}</span><h2>${mode==='exam'?'👹 '+esc(battle.enemy.name):'Aprendizado sem dano'}</h2>${mode==='exam'?`<p class="hp">❤️ Herói: ${hp}/100</p><div class="bar"><div style="width:${hp}%"></div></div><p>👹 Inimigo: ${ehp}/${maxhp}</p><div class="bar"><div style="width:${100*ehp/maxhp}%;background:#dd6079"></div></div>`:''}<p class="mini">Pergunta ${qindex+1}/${questionList.length} · Dificuldade ${q.difficulty}/10</p><p class="question">${esc(q.prompt)}</p><div id="answers">${q.options.map((op,i)=>`<button class="answer" data-answer="${i}">${'ABCD'[i]}. ${esc(op)}</button>`).join('')}</div><div id="feedback"></div><button id="next" class="hide">Próxima →</button></div>`;$('#leave').onclick=()=>enter('lesson');document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>action(async()=>{document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);const result=await request('/answer','POST',{mode,questionId:q.id,selectedIndex:Number(b.dataset.answer),battleId:battle?.id});battle=result.battle||battle;$('#feedback').innerHTML=`<div class="card"><h3>${result.correct?'✅ Acertou!':'❌ Errou!'}</h3><p>${esc(result.explanation)}</p>${mode==='exam'?`<p>${result.correct?'⚔️ Inimigo perdeu 20 HP':'❤️ Você perdeu 25 HP'}</p>`:''}</div>`;$('#next').classList.remove('hide');$('#next').textContent=battle?.status!=='active'?'Resultado final →':'Próxima →';$('#next').onclick=()=>{qindex++;quiz()}}))}
function shop(){$('#content').innerHTML=`<h2>🛒 Mercadores do Reino</h2><p>Saldo: <strong class="gold">🪙 ${db.player.gold}</strong> · Ganhe ouro vencendo provas.</p><div class="grid">${db.catalog.map(item=>{const owned=db.inventory.find(i=>i.sku===item.sku),purchased=item.kind!=='item'&&owned;return `<div class="card"><span class="tag">${esc(item.kind)}</span><h3>${esc(item.name)}</h3><p class="gold">🪙 ${item.gold_cost}</p><p>Possui: ${owned?.quantity||0}</p><button data-buy="${esc(item.sku)}" ${purchased?'disabled':''}>${purchased?'Adquirido':'Comprar'}</button></div>`}).join('')}</div><p class="mini">Os itens são colecionáveis nesta versão inicial; equipamentos e construções visuais serão implementados na próxima etapa.</p>`;document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>action(async()=>{await request('/shop/buy','POST',{sku:b.dataset.buy});await refresh();enter('shop');notify('Compra efetuada!')}))}
function review(){const due=db.mastery.filter(m=>new Date(m.due_at)<=new Date());$('#content').innerHTML=`<h2>🔁 Revisões e Chefes de Lacuna</h2><p>${due.length} tópico(s) para revisar. Erros recentes voltam mais cedo.</p>${due.map(m=>`<div class="card"><h3>👹 ${esc(m.topic)}</h3><p>Domínio estimado: ${Math.round(m.score*100)}% · Acertos ${m.successes} · Erros ${m.failures}</p><button data-j="${m.journey_id}">Abrir jornada</button></div>`).join('')||'<div class="card">Nenhuma revisão vencida. Continue sua jornada.</div>'}`;document.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{chosenJourney=b.dataset.j;enter('journey')})}
$('#logout').onclick=async()=>{await supabase.auth.signOut();showLogin()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>enter(b.dataset.view));
(async()=>{try{const config=await fetch('/api/config').then(r=>r.json());if(!config.url||!config.key)throw Error('Servidor não configurado');supabase=createClient(config.url,config.key);$('#loginform').onsubmit=e=>{e.preventDefault();action(async()=>{const {error}=await supabase.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)throw error;await init()})};const {data}=await supabase.auth.getSession();if(data.session)await init();else showLogin()}catch(e){notify(e.message)}})();
async function init(){session=(await supabase.auth.getSession()).data.session;$('#login').classList.add('hide');$('#app').classList.remove('hide');$('#logout').classList.remove('hide');try{await refresh()}catch(e){await supabase.auth.signOut();showLogin();notify(e.message)}}
</script></body></html>
